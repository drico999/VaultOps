name: Build and Deploy

on:
  push:
    branches: [main]

# Required for OIDC: lets this workflow request a short-lived identity
# token from GitHub to present to AWS, instead of using stored secrets.
permissions:
  id-token: write
  contents: read

env:
  DOCKERHUB_IMAGE: andries999/week1-app
  AWS_REGION: af-south-1
  ASG_NAME: week2-cloud-project-asg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # No more AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets.
      # GitHub mints a short-lived OIDC token for this run, AWS checks it
      # against the trust policy on AWS_ROLE_ARN (repo + branch scoped,
      # see oidc.tf) and hands back temporary credentials for this job only.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get running instance IDs from the Auto Scaling Group
        id: instances
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)
          echo "Found instances: $IDS"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy new image via SSM
        run: |
          INSTANCE_IDS=(${{ steps.instances.outputs.ids }})

          if [ ${#INSTANCE_IDS[@]} -eq 0 ]; then
            echo "No running instances found - aborting deploy"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ needs.build-and-push.outputs.image_tag }} via GitHub Actions" \
            --targets "Key=InstanceIds,Values=$(IFS=,; echo "${INSTANCE_IDS[*]}")" \
            --parameters "{\"commands\":[\
              \"docker pull ${{ env.DOCKERHUB_IMAGE }}:latest\",\
              \"docker stop app || true\",\
              \"docker rm app || true\",\
              \"docker run -d --name app --restart always -p 5000:5000 -e DB_HOST=${{ secrets.DB_HOST }} -e DB_PORT=5432 -e DB_NAME=${{ secrets.DB_NAME }} -e DB_USER=${{ secrets.DB_USER }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ env.DOCKERHUB_IMAGE }}:latest\"\
            ]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete on all instances..."
          sleep 15

          # Check the result on every targeted instance - fail the job if any failed
          for id in "${INSTANCE_IDS[@]}"; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$id" \
              --query 'Status' \
              --output text)
            echo "Instance $id: $STATUS"
            if [ "$STATUS" != "Success" ]; then
              echo "Deployment failed on instance $id"
              exit 1
            fi
          done

          echo "Deployment succeeded on all instances."